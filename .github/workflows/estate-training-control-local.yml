name: Estate local training-control certificate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch exact canonical repository validator
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          commit='427a99cf86dcc890c59372305b57806196253299'; expected='1e367e9fc7878ee355adb856499a0e5bed16d1e4'
          data=urllib.request.urlopen(f'https://raw.githubusercontent.com/Anurag9000/RigorousRAG/{commit}/tools/repository_local_estate_certificate_v6.py',timeout=60).read(); actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          if actual!=expected: raise SystemExit(f'validator blob mismatch: {actual} != {expected}')
          p=Path('.training_control/canonical_repository_local_estate_certificate.py'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          PY
      - name: Certify this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .training_control/canonical_repository_local_estate_certificate.py --repository "$GITHUB_REPOSITORY" --root . --output .training_control/local_estate_certificate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estate-local-training-control-${{ github.sha }}
          path: .training_control/local_estate_certificate.json
          if-no-files-found: warn
          retention-days: 30
