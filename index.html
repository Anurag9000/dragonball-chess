<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>DragonBall Chess — Local 2P (All Fixes)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Local vendor scripts (no network required if vendored locally) -->
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="vendor/chess.min.js"></script>
  <script>
    // Tell the loader where the .wasm lives
    window.Module = { locateFile: p => 'vendor/lichess/' + p };
  </script>
  <style>
    #bootlog {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.7);
      color: #e2e8f0;
      font: 12px/1.4 ui-sans-serif, system-ui;
      padding: 8px 10px;
      border-radius: 8px;
      max-width: 60vw;
    }
  </style>
  <script>
    (function () {
      const box = document.createElement('div');
      box.id = 'bootlog';
      box.textContent = 'Boot: init';
      document.addEventListener('DOMContentLoaded', () => document.body.appendChild(box));
      window.__log = (...a) => { box.textContent = a.join(' | '); console.log('[DBZ]', ...a); };
      window.addEventListener('error', e => { __log('ERROR', e.message); });
    })();
  </script>

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    .square {
      aspect-ratio: 1 / 1;
      position: relative;
    }

    .light {
      background: #f0d9b5;
    }

    .dark {
      background: #b58863;
    }

    .highlight {
      outline: 3px solid rgba(255, 230, 0, 0.8);
      outline-offset: -3px;
    }

    .last-move {
      background: rgba(255, 255, 0, 0.22) !important;
    }

    .legal-dot::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.18);
      position: absolute;
      inset: 0;
      margin: auto;
    }

    .capture-ring::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 3px solid rgba(220, 38, 38, 0.85);
      border-radius: 8px;
    }

    .mask {
      background: rgba(2, 6, 23, 0.78);
    }

    /* Piece rendering */
    .piece-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6%;
      pointer-events: none;
      z-index: 10;
    }

    .piece-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      display: block;
    }

    .piece-badge {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.6);
      border-radius: 9999px;
      padding: 2px 6px;
      max-width: 90%;
      margin: 0 auto;
      pointer-events: none;
      backdrop-filter: blur(3px);
    }

    /* Team visuals */
    .team-w .piece-img {
      filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.9)) drop-shadow(0 0 16px rgba(147, 197, 253, 0.7));
    }

    .team-b .piece-img {
      filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.9)) drop-shadow(0 0 16px rgba(254, 202, 202, 0.7));
    }

    .team-ring {
      position: absolute;
      inset: 5px;
      border-radius: 10px;
      pointer-events: none;
    }

    .team-w .team-ring {
      border: 3px solid rgba(59, 130, 246, 0.85);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.45) inset;
    }

    .team-b .team-ring {
      border: 3px solid rgba(239, 68, 68, 0.85);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.45) inset;
    }

    .team-w .piece-badge {
      background: rgba(59, 130, 246, 0.22);
      border-radius: 9999px;
      display: inline-block;
      padding: 2px 6px;
    }

    .team-b .piece-badge {
      background: rgba(239, 68, 68, 0.22);
      border-radius: 9999px;
      display: inline-block;
      padding: 2px 6px;
    }

    .pulse {
      animation: pulseScale 320ms ease-out;
    }

    @keyframes pulseScale {
      0% {
        transform: scale(0.82);
        opacity: 0.65;
        filter: saturate(0.6) brightness(1.1);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .pulse-slow {
      animation: pulseSlow 1.5s ease-in-out infinite;
    }

    @keyframes pulseSlow {

      0%,
      100% {
        opacity: 0.7;
      }

      50% {
        opacity: 1;
      }
    }

    /* Layout */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 320px;
    }

    .card {
      background: rgba(30, 41, 59, 0.4);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 4px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .btn {
      background: #334155;
      color: #e2e8f0;
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .btn:hover {
      background: #475569;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status {
      font-size: 14px;
      opacity: 0.9;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    /* Overlay canvas fully covering board */
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .overlay>canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <div id="root" class="min-h-full flex items-center justify-center p-4"></div>

  <!-- App -->
  <script type="text/babel" data-presets="env,react">
    window.bootDBZ = function () {
      if (!window.Chess) { __log('bootDBZ called but Chess missing'); }
      if (!window.React || !window.ReactDOM) { __log('React/ReactDOM missing'); }

      const { useState, useEffect, useRef } = React;

      // ---------- Helpers ----------
      const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const RANKS = [8, 7, 6, 5, 4, 3, 2, 1];
      const isDark = (fileIdx, rankIdx) => (fileIdx + rankIdx) % 2 !== 0;

      function sqToFR(sq) { const f = FILES.indexOf(sq[0]); const rNum = parseInt(sq[1], 10); const rIdx = 8 - rNum; return { f, rNum, rIdx }; }
      function frToSq(f, rNum) { if (f < 0 || f > 7 || rNum < 1 || rNum > 8) return null; return FILES[f] + String(rNum); }

      // --- Promotion mapping (UI choices → DBZ character for your uniform set)
      const PROMO_OPTIONS = ['q', 'r', 'b', 'n'];
      const PROMO_CHAR = {
        q: 'grand_priest',
        r: 'goku',
        b: 'majin_boo',
        n: 'gohan_kid',
      };

      // DBZ forms
      const FORMS = {
        goku: ['base', 'kaioken', 'ssj', 'ssj2', 'ssj3', 'ssj4', 'ssg', 'ssb', 'ssb_kaioken', 'ui', 'mui'],
        vegeta: ['base', 'great_ape', 'ssj', 'ssj2', 'ssj3', 'ssj4', 'ssg', 'ssb', 'ssb_evolved', 'ultra_ego'],
        zeno: ['zeno'], whis: ['angel'], grand_priest: ['grand_priest'],
        piccolo: ['base', 'potential', 'orange'], krillin: ['base'], yamcha: ['base'], tien: ['base'], chiaotzu: ['base'], android_18: ['base'],
        majin_boo: ['fat', 'evil', 'super', 'buutenks', 'buuccolo', 'buuhan', 'kid_buu'],
        frieza: ['1', '2', '3', 'final', 'mecha', 'golden', 'black'], saibaman: ['base'],
        gohan_kid: ['base', 'ssj', 'ssj2', 'ssj3', 'mystic', 'beast'], gotenks: ['base', 'ssj', 'ssj2', 'ssj3'],
      };

      function spriteUrl(char, formKey) {
        if (!char) return '';
        const forms = FORMS[char] || ['base'];
        const key = forms.includes(formKey) ? formKey : forms[0];
        return `assets/pieces/${char}/${key}.png`;
      }

      const TYPE_ALLOWED = {
        k: new Set(['zeno']), q: new Set(['grand_priest']), r: new Set(['goku', 'vegeta']),
        b: new Set(['majin_boo', 'gotenks']), n: new Set(['gohan_kid', 'frieza']),
        p: new Set(['saibaman', 'chiaotzu', 'krillin', 'tien', 'whis', 'yamcha', 'piccolo', 'android_18']),
      };

      const PAWN_FILES_DEFAULT = ['saibaman', 'chiaotzu', 'krillin', 'tien', 'whis', 'yamcha', 'piccolo', 'android_18'];

      const POWER_OF = st => (st?.formIdx ?? 0);
      const LIVES_OF = st => (st?.life ?? 0);

      function clampForm(char, formIdx) {
        const forms = FORMS[char] ?? ['base'];
        const idx = Math.min(Math.max(0, formIdx | 0), forms.length - 1);
        return { forms, formIdx: idx };
      }

      function ensureMappingStrict(chess, rosterMap) {
        const out = new Map(); let changed = false;
        for (const f of FILES) for (const r of RANKS) {
          const sq = `${f}${r}`; const p = chess.get(sq); if (!p) continue;
          const allowed = TYPE_ALLOWED[p.type] || new Set(); let dbz = rosterMap.get(sq);
          if (!dbz) {
            let char = 'grand_priest';
            if (p.type === 'k') char = 'zeno';
            else if (p.type === 'q') char = 'grand_priest';
            else if (p.type === 'r') char = 'goku';
            else if (p.type === 'b') char = 'majin_boo';
            else if (p.type === 'n') char = 'gohan_kid';
            else if (p.type === 'p') { const fileIdx = FILES.indexOf(f); char = PAWN_FILES_DEFAULT[fileIdx] || 'saibaman'; }
            const { forms, formIdx } = clampForm(char, 0);
            dbz = { id: `${p.color}_${char}_${Math.random().toString(36).slice(2, 9)}`, color: p.color, char, life: 0, kills: 0, forms, formIdx, maxForm: 0 };
            changed = true;
          } else {
            let char = dbz.char;
            if (!allowed.has(char)) {
              if (p.type === 'k') char = 'zeno';
              else if (p.type === 'q') char = 'grand_priest';
              else if (p.type === 'r') char = 'goku';
              else if (p.type === 'b') char = 'majin_boo';
              else if (p.type === 'n') char = 'gohan_kid';
              else if (p.type === 'p') {
                if (!TYPE_ALLOWED.p.has(char)) {
                  const fileIdx = FILES.indexOf(f);
                  char = PAWN_FILES_DEFAULT[fileIdx] || 'saibaman';
                }
              }
              const { forms, formIdx } = clampForm(char, dbz.formIdx ?? 0);
              dbz = { ...dbz, char, forms, formIdx }; changed = true;
            } else {
              const { forms, formIdx } = clampForm(char, dbz.formIdx ?? 0);
              let maxForm = dbz.maxForm ?? formIdx;
              if (maxForm < formIdx) maxForm = formIdx;
              if (maxForm > forms.length - 1) maxForm = forms.length - 1;
              if (forms !== dbz.forms || formIdx !== dbz.formIdx || maxForm !== dbz.maxForm) {
                dbz = { ...dbz, forms, formIdx, maxForm }; changed = true;
              }
            }
            if (dbz.color !== p.color) { dbz = { ...dbz, color: p.color }; changed = true; }
          }
          out.set(sq, dbz);
        }
        return [out, changed];
      }


      function initialRoster() {
        const m = new Map();
        // White back rank
        m.set('a1', mk('w', 'goku')); m.set('b1', mk('w', 'gohan_kid')); m.set('c1', mk('w', 'majin_boo')); m.set('d1', mk('w', 'grand_priest')); m.set('e1', mk('w', 'zeno')); m.set('f1', mk('w', 'gotenks')); m.set('g1', mk('w', 'frieza')); m.set('h1', mk('w', 'vegeta'));
        // White pawns
        ['a2', 'b2', 'c2', 'd2', 'e2', 'f2', 'g2', 'h2'].forEach((sq, i) => m.set(sq, mk('w', PAWN_FILES_DEFAULT[i])));

        // Black back rank
        m.set('a8', mk('b', 'goku')); m.set('b8', mk('b', 'gohan_kid')); m.set('c8', mk('b', 'majin_boo')); m.set('d8', mk('b', 'grand_priest')); m.set('e8', mk('b', 'zeno')); m.set('f8', mk('b', 'gotenks')); m.set('g8', mk('b', 'frieza')); m.set('h8', mk('b', 'vegeta'));
        // Black pawns
        ['a7', 'b7', 'c7', 'd7', 'e7', 'f7', 'g7', 'h7'].forEach((sq, i) => m.set(sq, mk('b', PAWN_FILES_DEFAULT[i])));

        return m;

        function mk(color, char) {
          const forms = FORMS[char] ?? ['base'];
          const entropy = Math.random().toString(36).slice(2, 11) + Date.now().toString(36).slice(-4);
          return { id: `${color}_${char}_${entropy}`, color, char, life: 0, kills: 0, formIdx: 0, maxForm: 0, forms };
        }
      }

      // ---------- Main App ----------
      // ---------- Main App Components (Extracted for performance) ----------
      const Panel = React.memo(({ title, children }) => {
        return (
          <div className="card">
            <div style={{ fontWeight: 600, marginBottom: '8px' }}>{title}</div>
            {children}
          </div>
        );
      });

      const Board = React.memo(({ game, roster, selected, legal, fog, onSquareClick, trailRef, lastMove }) => {
        return (
          <div className="board" style={{ position: 'relative' }}>
            {RANKS.map((r, rIdx) =>
              FILES.map((f, fIdx) => {
                const sq = `${f}${r}`;
                const dark = isDark(fIdx, rIdx);
                const p = game.get(sq);
                const dbz = roster.get(sq);
                const isSel = selected === sq;
                const isLegal = legal.has(sq);
                const isLast = lastMove && (lastMove.from === sq || lastMove.to === sq);

                // Fog check: hidden if fog is on AND (it's not your side AND (no piece OR not your piece))
                const turn = game.turn();
                const hide = fog && (
                  (turn === 'w' && r > 4 && (!p || p.color !== 'w')) ||
                  (turn === 'b' && r < 5 && (!p || p.color !== 'b'))
                );
                const teamClass = p ? (p.color === 'w' ? 'team-w' : 'team-b') : '';

                return (
                  <div
                    key={sq}
                    onClick={() => onSquareClick(sq, hide)}
                    className={`relative square flex items-center justify-center select-none cursor-pointer ${dark ? 'dark' : 'light'} ${isSel ? 'highlight' : ''} ${isLast ? 'last-move' : ''} ${teamClass}`}
                    style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}
                  >
                    {hide && <div className="absolute inset-0 mask" style={{ position: 'absolute', inset: 0 }}></div>}
                    {isLegal && !p && !hide && <div className="absolute inset-0 legal-dot" style={{ position: 'absolute', inset: 0 }} />}
                    {isLegal && p && !hide && <div className="absolute inset-0 capture-ring" style={{ position: 'absolute', inset: 0 }} />}

                    {p && dbz && !hide && (
                      <>
                        <div className="team-ring" />
                        <div className="piece-layer">
                          <img className="piece-img" draggable="false"
                            src={spriteUrl(dbz.char, dbz.forms[dbz.formIdx])}
                            onError={(e) => {
                              const fallback = spriteUrl(dbz.char, 'base');
                              if (e.currentTarget.src !== fallback) e.currentTarget.src = fallback;
                              else e.currentTarget.style.display = 'none';
                            }}
                            alt={`${dbz.char} ${dbz.forms[dbz.formIdx]}`}
                          />
                        </div>
                        <div className="piece-badge">{dbz.forms[dbz.formIdx]} · ❤{dbz.life}</div>
                      </>
                    )}
                  </div>
                );
              })
            )}
            <div className="overlay" aria-hidden="true" style={{ position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 10 }}>
              <canvas ref={trailRef} />
            </div>
          </div>
        );
      });

      function App() {
        const [game, setGame] = useState(() => new Chess());
        const [roster, setRoster] = useState(() => initialRoster());
        const [selected, setSelected] = useState(null);
        const [legal, setLegal] = useState(new Set());
        const [status, setStatus] = useState('');
        const [lastMove, setLastMove] = useState(null);
        const fenBefore = useRef('');
        const [toast, setToast] = useState(null);
        const [fog, setFog] = useState(false);
        const trailRef = useRef(null);
        // Promotion UI state: when a pawn reaches last rank and user must choose
        const [promo, setPromo] = useState(null); // { from, to, color } | null

        function needsPromotion(from, to) {
          const p = game.get(from); if (!p || p.type !== 'p') return false;
          const rank = parseInt(to[1], 10);
          return (p.color === 'w' && rank === 8) || (p.color === 'b' && rank === 1);
        }

        // Normalize guards after every position change
        useEffect(() => {
          const t = setTimeout(() => {
            setRoster(prev => {
              const [norm, changed] = ensureMappingStrict(game, prev);
              if (changed) __log('Roster normalized to strict mapping');
              return changed ? norm : prev;
            });
          }, 0);
          return () => clearTimeout(t);
        }, [game]);

        // History & engine
        const historyRef = useRef([]);
        const [aiWhite, setAiWhite] = useState(false);
        const [aiBlack, setAiBlack] = useState(false);
        const [hardness, setHardness] = useState('Normal');
        function hardnessProfile(h) {
          if (h === 'Easy') return { elo: 1000, movetime: 500, depth: 8, hash: 8 };
          if (h === 'Hard') return { elo: 2000, movetime: 900, depth: 16, hash: 16 };
          if (h === 'Insane') return { elo: 2600, movetime: 1300, depth: 22, hash: 32 };
          return { elo: 1500, movetime: 700, depth: 12, hash: 12 };
        }
        const [engineReady, setEngineReady] = useState(false);
        const [engineThinks, setEngineThinks] = useState(false);
        const engineRef = useRef(null);
        const engineBuf = useRef([]);
        const pendingBest = useRef(null);
        const thinkWatchdog = useRef(null);
        const engineBooting = useRef(false);
        const [capturedByWhite, setCapturedByWhite] = useState([]);
        const [capturedByBlack, setCapturedByBlack] = useState([]);

        function post(s) { try { engineRef.current?.postMessage(s); } catch (e) { logEngine('ERR', `post fail: ${e?.message || e}`); } }
        function logEngine(side, text) { const line = `[${new Date().toLocaleTimeString()}] ${side}: ${text}`; engineBuf.current.push(line); if (engineBuf.current.length > 60) engineBuf.current.splice(0, engineBuf.current.length - 60); __log(text); }

        useEffect(() => { refreshStatus(); maybeEngineTurn(); }, []);

        function refreshStatus() {
          if (game.isGameOver()) {
            if (game.isCheckmate()) setStatus(`Checkmate — ${game.turn() === 'w' ? 'Black' : 'White'} wins`);
            else if (game.isStalemate()) setStatus('Stalemate');
            else if (game.isDraw()) setStatus('Draw');
            else setStatus('Game over');
            try { post('stop'); } catch (_) { }
            try { engineRef.current?.terminate?.(); } catch (_) { }
            engineRef.current = null; pendingBest.current = null; setEngineThinks(false);
            if (thinkWatchdog.current) { clearTimeout(thinkWatchdog.current); thinkWatchdog.current = null; }
            setEngineReady(false);
            return;
          }
          const t = game.turn() === 'w' ? 'White' : 'Black';
          const flags = [game.isCheck() ? 'Check' : null].filter(Boolean).join(' • ');
          setStatus(`${t} to move${flags ? ' — ' + flags : ''}`);
        }

        function flashNotice(msg) { setToast(msg); setTimeout(() => setToast(null), 1200); }
        function bumpMaxForm(state, newFormIdx) { const nf = Math.max(newFormIdx, state.maxForm ?? state.formIdx ?? 0); return { ...state, maxForm: nf }; }

        // ========= TURN-AGNOSTIC ATTACK DETECTOR (Fix #1) =========
        function attackersFromColor(targetSq, attackerColor) {
          const { f: tf, rNum: trNum } = sqToFR(targetSq);
          const attackers = new Set();

          // Knights (must be knights)
          const kOff = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
          for (const [df, dr] of kOff) {
            const sq = frToSq(tf + df, trNum + dr); if (!sq) continue; const p = game.get(sq);
            if (p && p.color === attackerColor && p.type === 'n') attackers.add(sq);
          }
          // King
          for (let df = -1; df <= 1; df++) for (let dr = -1; dr <= 1; dr++) if (df || dr) {
            const sq = frToSq(tf + df, trNum + dr); const p = sq ? game.get(sq) : null; if (p && p.color === attackerColor && p.type === 'k') attackers.add(sq);
          }
          // Pawns
          if (attackerColor === 'w') {
            const sq1 = frToSq(tf - 1, trNum - 1), sq2 = frToSq(tf + 1, trNum - 1);
            const p1 = sq1 ? game.get(sq1) : null, p2 = sq2 ? game.get(sq2) : null;
            if (p1 && p1.color === 'w' && p1.type === 'p') attackers.add(sq1);
            if (p2 && p2.color === 'w' && p2.type === 'p') attackers.add(sq2);
          } else {
            const sq1 = frToSq(tf - 1, trNum + 1), sq2 = frToSq(tf + 1, trNum + 1);
            const p1 = sq1 ? game.get(sq1) : null, p2 = sq2 ? game.get(sq2) : null;
            if (p1 && p1.color === 'b' && p1.type === 'p') attackers.add(sq1);
            if (p2 && p2.color === 'b' && p2.type === 'p') attackers.add(sq2);
          }
          // Sliders
          const rays = [{ dirs: [[1, 0], [-1, 0], [0, 1], [0, -1]], types: new Set(['r', 'q']) }, { dirs: [[1, 1], [1, -1], [-1, 1], [-1, -1]], types: new Set(['b', 'q']) }];
          for (const grp of rays) {
            for (const [df, dr] of grp.dirs) {
              let ff = tf + df, rr = trNum + dr;
              while (true) {
                const sq = frToSq(ff, rr); if (!sq) break; const p = game.get(sq);
                if (!p) { ff += df; rr += dr; continue; }
                if (p.color === attackerColor && grp.types.has(p.type)) attackers.add(sq);
                break; // stop ray on first piece
              }
            }
          }
          return attackers;
        }
        function kingSquareOf(color) {
          const b = game.board();
          for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
            const cell = b[r][c]; if (cell && cell.type === 'k' && cell.color === color) { return `${FILES[c]}${8 - r}`; }
          }

              </Panel>

              <Panel title="Engine">
                <div className="row" style={{ alignItems: 'center' }}>
                  <label style={{ fontSize: 12, opacity: 0.9, width: 90 }}>AI as White</label>
                  <input type="checkbox" checked={aiWhite} onChange={e => setAiWhite(e.target.checked)} />
                </div>
                <div className="row" style={{ alignItems: 'center' }}>
                  <label style={{ fontSize: 12, opacity: 0.9, width: 90 }}>AI as Black</label>
                  <input type="checkbox" checked={aiBlack} onChange={e => setAiBlack(e.target.checked)} />
                </div>
                <div className="row" style={{ alignItems: 'center', marginTop: 8 }}>
                  <label style={{ fontSize: 12, opacity: 0.9, width: 90 }}>Hardness</label>
                  <select className="btn" value={hardness} onChange={e => setHardness(e.target.value)}>
                    <option>Easy</option>
                    <option>Normal</option>
                    <option>Hard</option>
                    <option>Insane</option>
                  </select>
                  <button className="btn" onClick={bootEngine} disabled={engineThinks} style={{ marginLeft: 8 }}>Apply</button>
                </div>
                <div style={{ fontSize: 12, opacity: 0.85, marginTop: 6 }}>
                  Engine strength & think time auto-tuned by Hardness.
                </div>
              </Panel>

              <Panel title="Turn / State">
                <div className="text-sm leading-relaxed">
                  <div><b>Side:</b> {game.turn() === 'w' ? 'White' : 'Black'}</div>
                  <div><b>Check:</b> {game.isCheck() ? 'Yes' : 'No'}</div>
                  <div><b>Stalemate:</b> {game.isStalemate() ? 'Yes' : 'No'}</div>
                  <div><b>Castling Rights:</b> <code style={{ fontSize: '12px' }}>{game.fen().split(' ')[2]}</code></div>
                  <div><b>En Passant:</b> <code style={{ fontSize: '12px' }}>{game.fen().split(' ')[3]}</code></div>
                </div>
              </Panel>

              <Panel title="DBZ Rules (active)">
                <ul style={{ paddingLeft: '18px', fontSize: '14px', lineHeight: 1.5 }}>
                  <li>On kill: attacker <b>life+1</b> & transforms.</li>
                  <li>On hit when defender has life &gt; 0: defender <b>form-1</b>, positions unchanged, <b>turn passes</b>.</li>
                  <li>Instant defeat: Attacker with strictly higher <b>power (form)</b> captures immediately, gains <b>+1 level</b> only.</li>
                  <li>While in check: the <b>King cannot capture</b> a checking piece if that checker has <b>lives &gt; 0</b>; the king must evade.</li>
                  <li>Also while in check: only a friendly piece with <b>more lives</b> than the checker may capture that checker.</li>
                  <li>Promotion shows choices (Q/R/B/N). Mapping: Queen→Grand Priest, Rook→Goku, Bishop→Majin Boo, Knight→Gohan Kid.</li>
                </ul>
              </Panel>

              <Panel title="Assets">
                <div style={{ fontSize: '12px', opacity: 0.9 }}>
                  Place sprites as PNGs:
                  <pre style={{ marginTop: '8px', background: '#0b1220', padding: '8px', borderRadius: '8px' }}>assets/pieces/goku/base.png, kaioken.png, ssj.png, ...
                    assets/pieces/vegeta/base.png, ssj.png, ssj2.png, ssb.png, ultra_ego.png
                    assets/pieces/zeno/zeno.png
                    assets/pieces/grand_priest/grand_priest.png
                    ... (others optional)</pre>
                  Missing sprites simply hide the image.
                </div>
              </Panel>
            </aside>

            {toast && (
              <div style={{ position: 'fixed', bottom: '16px', left: '50%', transform: 'translateX(-50%)', background: 'rgba(0,0,0,0.7)', padding: '8px 12px', borderRadius: '12px', fontSize: '14px', boxShadow: '0 8px 20px rgba(0,0,0,0.35)' }}>
                {toast}
              </div>
            )}
          </div>
        );
      }


      // Safe mount with diagnostics
      window.__mountApp = function () {
        try {
          if (!window.Chess) throw new Error('Chess not loaded');
          const rootEl = document.getElementById('root'); if (!rootEl) throw new Error('#root not found');
          ReactDOM.createRoot(rootEl).render(<App />);
          __log('Mounted OK');
        } catch (err) { __log('Mount failed:', err.message); throw err; }
      };

      setTimeout(() => { try { window.__mountApp(); } catch (_) { } }, 0);
    }
  </script>

  <!-- ES Module loader for chess.js (single source of truth) -->
  <script>
      // Simple boot
      (function check() {
        if (window.Chess && typeof window.bootDBZ === 'function') {
          window.bootDBZ();
        } else {
          setTimeout(check, 50);
        }
      })();
  </script>

  <script> console.log('Booting DBZ Chess…'); __log('Booting…'); </script>
</body>

</html>
